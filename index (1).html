<script>
'use strict';
const lessons = [
  {
    title:'Reações endotérmicas e exotérmicas', short:'O sinal da energia mostra quem absorve e quem libera calor.', unit:0, time:4, icon:'↕',
    essential:'Reação <b>exotérmica</b> libera energia para o ambiente (<b>ΔH &lt; 0</b>); reação <b>endotérmica</b> absorve energia (<b>ΔH &gt; 0</b>).',
    explain:`<p>Na termoquímica, chamamos de <strong>sistema</strong> aquilo que está sendo estudado (por exemplo, as substâncias no recipiente). A <strong>entalpia (H)</strong> ajuda a acompanhar a energia nas transformações feitas a pressão constante.</p><p>O valor importante é a <strong>variação de entalpia</strong>: <span class="formula">ΔH = H<sub>produtos</sub> − H<sub>reagentes</sub></span>. Se a energia final for menor, a reação liberou calor; se for maior, precisou receber calor.</p><p>Uma combustão é tipicamente <strong>exotérmica</strong>. Já a decomposição térmica do carbonato de cálcio, <span class="formula">CaCO₃ → CaO + CO₂</span>, necessita absorver calor para ocorrer.</p>`,
    points:[['Exotérmica','H dos produtos menor que H dos reagentes. ΔH negativo.'],['Endotérmica','H dos produtos maior que H dos reagentes. ΔH positivo.'],['Cuidado com o ponto de vista','O sinal de ΔH se refere ao sistema, não ao ambiente.']],viz:'enthalpy',
    exampleTitle:'Como identificar o tipo pela entalpia',steps:['Uma reação tem reagentes com H = 150 kJ e produtos com H = 90 kJ.','Substitua: ΔH = 90 − 150 = −60 kJ.','Como o resultado é negativo, o sistema perdeu 60 kJ na transformação.'],result:'É uma reação <b>exotérmica</b>, com <b>ΔH = −60 kJ</b>.',
    trap:'Não confunda <b>energia de ativação</b> com ΔH. Mesmo uma reação exotérmica pode precisar de uma energia inicial para começar.',note:'ΔH negativo → sai calor · ΔH positivo → entra calor.',bridge:'Nos próximos dois temas, você aprenderá a calcular ΔH a partir das ligações químicas ou das entalpias de formação.'
  },
  {
    title:'Entalpias de ligação',short:'Romper ligações custa energia. Formar ligações libera.',unit:0,time:4,icon:'⌁',
    essential:'<b>ΔH ≈ Σ(ligações rompidas) − Σ(ligações formadas)</b>. Rompimento absorve; formação libera energia.',
    explain:`<p>Para reagentes virarem produtos, algumas ligações químicas são <strong>rompidas</strong> e novas ligações são <strong>formadas</strong>.</p><p><strong>Romper</strong> uma ligação exige fornecimento de energia (<strong>processo endotérmico</strong>). <strong>Formar</strong> uma ligação libera energia (<strong>processo exotérmico</strong>). A soma dessas etapas permite <em>estimar</em> a variação de entalpia de uma reação, usando valores tabelados de energia de ligação.</p><p>Como as tabelas normalmente dão <strong>energias médias de ligação na fase gasosa</strong>, o resultado pode ser aproximado em relação ao ΔH experimental.</p>`,
    points:[['Romper = +','Some as energias necessárias para romper as ligações dos reagentes.'],['Formar = −','Subtraia as energias liberadas ao formar as ligações dos produtos.'],['Conte cada ligação','Coeficientes e quantidades de ligações importam no total.']],viz:'bonds',
    exampleTitle:'Formação de HCl a partir de H₂ e Cl₂',steps:['Equação: H₂(g) + Cl₂(g) → 2 HCl(g).','Ligações rompidas: H−H (436 kJ/mol) + Cl−Cl (243 kJ/mol) = 679 kJ.','Ligações formadas: 2 × H−Cl (431 kJ/mol) = 862 kJ.','ΔH ≈ 679 − 862 = −183 kJ.'],result:'Como a formação libera mais energia do que o rompimento consome, <b>ΔH ≈ −183 kJ</b> para a reação como escrita.',
    trap:'Não some tudo sem sinais. <b>Rompimento entra positivo</b> e <b>formação entra subtraindo</b>. A energia de ligação se refere ao processo de romper a ligação.',note:'Quebrar gasta; formar devolve.',bridge:'Outra forma de encontrar ΔH utiliza substâncias formadas a partir de seus elementos: as entalpias de formação.'
  },
  {
    title:'Entalpias de formação',short:'Calcule a energia de uma reação a partir de tabelas.',unit:0,time:5,icon:'∑',
    essential:'<b>ΔH°<sub>reação</sub> = Σ νΔH°<sub>f</sub>(produtos) − Σ νΔH°<sub>f</sub>(reagentes)</b>.',
    explain:`<p>A <strong>entalpia padrão de formação (ΔH°<sub>f</sub>)</strong> corresponde à variação de entalpia na formação de <strong>1 mol</strong> de uma substância a partir de seus elementos em seus estados padrão e formas mais estáveis na condição considerada.</p><p>Por convenção, a entalpia padrão de formação de um <strong>elemento em sua forma estável de referência</strong> é zero, como O₂(g) e H₂(g). Isso <strong>não vale</strong> automaticamente para átomos isolados ou para substâncias compostas.</p><p>Para uma equação balanceada, faça a soma das entalpias de formação dos produtos, respeitando os coeficientes, e <strong>subtraia</strong> a soma correspondente dos reagentes.</p>`,
    points:[['Elementos no estado padrão','Em sua forma de referência, ΔH°f = 0. Ex.: O₂(g).'],['Coeficientes importam','Dois mols de água representam 2 × ΔH°f[H₂O].'],['Estado físico importa','ΔH°f da água líquida é diferente da água em vapor.']],viz:'formation',
    exampleTitle:'Combustão do metano com dados de tabela',steps:['Equação: CH₄(g) + 2 O₂(g) → CO₂(g) + 2 H₂O(l).','Dados (kJ/mol): CH₄ = −74,8; O₂ = 0; CO₂ = −393,5; H₂O(l) = −285,8.','Produtos: −393,5 + 2(−285,8) = −965,1 kJ.','Reagentes: −74,8 + 2(0) = −74,8 kJ.','ΔH° = −965,1 − (−74,8) = −890,3 kJ.'],result:'A combustão de <b>1 mol de CH₄</b>, formando água líquida nas condições padrão, libera aproximadamente <b>890,3 kJ</b>.',
    trap:'A fórmula é sempre <b>produtos menos reagentes</b>. Não troque a ordem e nunca ignore os coeficientes estequiométricos.',note:'P − R, com coeficientes e estados físicos.',bridge:'A Lei de Hess explica por que podemos somar equações e obter o ΔH de uma reação global.'
  },
  {
    title:'Lei de Hess',short:'A energia depende do início e do fim, não do caminho.',unit:0,time:4,icon:'⇢',
    essential:'<b>ΔH<sub>global</sub> = ΔH₁ + ΔH₂ + ...</b> (com as equações ajustadas corretamente).',
    explain:`<p>A <strong>Lei de Hess</strong> diz que a variação de entalpia de uma reação depende apenas dos <strong>estados inicial e final</strong>. A reação pode ocorrer em uma única etapa ou em várias: se os reagentes e produtos globais forem os mesmos, o ΔH total também será.</p><p>Para resolver, manipule equações termoquímicas conhecidas até que a soma produza a equação desejada. As espécies presentes nos dois lados se cancelam.</p><p>Existem duas regras decisivas: <strong>inverteu uma equação → inverte o sinal de ΔH</strong>; <strong>multiplicou toda a equação por n → multiplica ΔH por n</strong>.</p>`,
    points:[['Somar etapas','Some também os valores de ΔH.'],['Inverter a seta','ΔH troca de sinal.'],['Multiplicar coeficientes','Multiplique ΔH pelo mesmo número.']],viz:'hess',
    exampleTitle:'Obter a formação de CO₂ em duas etapas',steps:['Etapa 1: C(grafite) + ½ O₂(g) → CO(g), ΔH₁ = −110,5 kJ.','Etapa 2: CO(g) + ½ O₂(g) → CO₂(g), ΔH₂ = −283,0 kJ.','Some e cancele o CO, que aparece como produto na 1ª e reagente na 2ª.','Resultado: C(grafite) + O₂(g) → CO₂(g).','ΔH = −110,5 + (−283,0) = −393,5 kJ.'],result:'Caminho direto ou duas etapas: a variação de entalpia global é <b>−393,5 kJ</b>.',
    trap:'Se você <b>multiplicar a equação</b> e esquecer de multiplicar ΔH, o resultado estará errado. Também confira se a equação final ficou realmente igual à solicitada.',note:'O caminho muda; o ΔH entre os mesmos estados não.',bridge:'Combustão é uma aplicação cotidiana da termoquímica, ligada aos combustíveis e à produção de energia.'
  },
  {
    title:'Combustíveis',short:'Energia armazenada em substâncias que podem reagir.',unit:0,time:4,icon:'♨',
    essential:'Combustão costuma ser <b>exotérmica</b>; na combustão completa de hidrocarbonetos, os principais produtos são <b>CO₂ e H₂O</b>.',
    explain:`<p>Um <strong>combustível</strong> é uma substância que pode sofrer reação liberando energia aproveitável, frequentemente pela <strong>combustão</strong> com o gás oxigênio (O₂). Gasolina, etanol, gás natural e carvão são exemplos.</p><p>Na <strong>combustão completa</strong> de um hidrocarboneto há O₂ suficiente e formam-se principalmente CO₂ e H₂O. Na <strong>combustão incompleta</strong> podem se formar <strong>CO (monóxido de carbono)</strong> e fuligem (carbono), além de outros produtos.</p><p>O <strong>poder calorífico</strong> compara quanto calor um combustível libera por unidade de massa ou volume, conforme a base utilizada. O impacto ambiental também depende da obtenção, produção, transporte e uso do combustível.</p>`,
    points:[['Com O₂ suficiente','Maior tendência à combustão completa: CO₂ + H₂O para hidrocarbonetos.'],['Com O₂ limitado','Pode formar CO e fuligem.'],['Rendimento e impactos','Não basta saber quanto calor libera: importa de onde veio e o que emite.']],viz:'combustion',
    exampleTitle:'Balanceamento da combustão do etanol',steps:['Escreva: C₂H₅OH + O₂ → CO₂ + H₂O.','Balanceie o carbono: há 2 carbonos no etanol, então serão 2 CO₂.','Balanceie o hidrogênio: há 6 hidrogênios, então serão 3 H₂O.','À direita há 4 + 3 = 7 átomos de O. O etanol já contém 1; faltam 6, que equivalem a 3 O₂.'],result:'Equação completa: <b>C₂H₅OH + 3 O₂ → 2 CO₂ + 3 H₂O</b>. É uma reação exotérmica.',
    trap:'“Biocombustível” não significa “sem emissão de CO₂” ao queimar. A avaliação climática precisa considerar o <b>ciclo de vida</b> do produto.',note:'Mais energia útil e menos poluição: compare o ciclo inteiro.',bridge:'O uso dos combustíveis conecta diretamente a Química aos problemas e soluções ambientais.'
  },
  {
    title:'Geração de energia e meio ambiente',short:'Transformar energia sempre envolve escolhas e impactos.',unit:0,time:4,icon:'◈',
    essential:'A avaliação ambiental considera <b>emissões, eficiência, origem da energia e impactos do ciclo de vida</b>.',
    explain:`<p>Grande parte da energia usada em transportes e indústrias vem de transformações químicas. Quando combustíveis fósseis são queimados, ocorre liberação de energia e, em geral, emissão de <strong>CO₂</strong>, que intensifica o efeito estufa.</p><p>Outros poluentes preocupam: <strong>SO₂</strong> e <strong>NOₓ</strong> podem contribuir para a formação de chuva ácida; <strong>CO</strong> é tóxico; <strong>material particulado</strong> afeta a qualidade do ar e a saúde.</p><p>Fontes como solar, eólica e hidráulica <strong>não precisam de combustão durante a geração</strong>, mas também possuem impactos de fabricação, instalação ou operação. Por isso, a análise correta compara <strong>todo o ciclo de vida</strong>, e não somente o que sai de uma chaminé.</p>`,
    points:[['CO₂ e clima','Aumenta a retenção de calor na atmosfera.'],['SO₂ / NOₓ','Podem dar origem a compostos envolvidos na chuva ácida.'],['Eficiência energética','Usar menos recursos para obter a mesma energia útil reduz desperdícios.']],viz:'environment',
    exampleTitle:'Por que trocar uma fonte energética pode ajudar',steps:['Uma termoelétrica a carvão produz eletricidade por combustão, com emissões diretas de CO₂ e outros poluentes.','Um parque eólico gera eletricidade sem queimar combustível durante a operação.','A comparação completa inclui fabricação dos equipamentos, manutenção, ocupação de áreas e descarte.'],result:'A energia eólica geralmente reduz emissões operacionais ligadas à combustão, mas <b>nenhuma tecnologia deve ser avaliada apenas por um único indicador</b>.',
    trap:'O <b>efeito estufa natural</b> é essencial à vida. O problema é sua <b>intensificação</b> pelo aumento das concentrações de gases de efeito estufa.',note:'Energia limpa na operação não é necessariamente impacto zero.',bridge:'Fim da termoquímica! Agora a pergunta muda: não apenas quanta energia é envolvida, mas quão rápido a transformação acontece.'
  },
  {
    title:'Rapidez das reações químicas',short:'Acompanhe a quantidade de substância ao longo do tempo.',unit:1,time:4,icon:'↗',
    essential:'A rapidez média mede a <b>variação de concentração dividida pelo intervalo de tempo</b>.',
    explain:`<p>A <strong>cinética química</strong> estuda a rapidez das reações e os fatores que a modificam. Alguns processos são rápidos (combustão), outros podem demorar muito (corrosão ou decomposição de materiais).</p><p>A rapidez média pode ser calculada pela variação na concentração: <span class="formula">v = −Δ[reagente]/Δt</span> ou <span class="formula">v = +Δ[produto]/Δt</span> para espécies com coeficiente 1. O sinal negativo para reagentes garante um valor positivo quando sua concentração diminui.</p><p>Para a reação geral <span class="formula">aA → bB</span>, a rapidez da reação deve considerar os coeficientes: <span class="formula">v = −(1/a)Δ[A]/Δt = (1/b)Δ[B]/Δt</span>. Assim, a definição fica consistente para todas as substâncias.</p>`,
    points:[['Reagentes diminuem','Sua concentração costuma cair com o tempo.'],['Produtos aumentam','A concentração formada geralmente cresce.'],['Unidade frequente','mol·L⁻¹·s⁻¹ (quando concentração em mol/L e tempo em s).']],viz:'rate',
    exampleTitle:'Calculando a rapidez média de consumo de A',steps:['A concentração de A cai de 0,80 para 0,50 mol/L em 10 segundos.','Variação: Δ[A] = 0,50 − 0,80 = −0,30 mol/L.','Rapidez média de consumo: −Δ[A]/Δt = −(−0,30)/10.'],result:'<b>0,030 mol·L⁻¹·s⁻¹</b> é a rapidez média de desaparecimento de A nesse intervalo. Se o coeficiente de A for 1, é também a rapidez média da reação.',
    trap:'Na rapidez média de uma reação, <b>divida pelo coeficiente estequiométrico</b> da substância observada. E não confunda rapidez média com rapidez instantânea.',note:'Concentração mudou? Divida pela duração; ajuste pelo coeficiente.',bridge:'O que faz uma reação ocorrer mais ou menos depressa? As colisões entre partículas.'
  },
  {
    title:'Teoria das colisões',short:'Nem todo choque entre partículas gera reação.',unit:1,time:4,icon:'✺',
    essential:'Para uma colisão ser efetiva, as partículas precisam de <b>energia suficiente</b> e <b>orientação favorável</b>.',
    explain:`<p>De acordo com a <strong>teoria das colisões</strong>, as partículas reagentes precisam se encontrar para que uma transformação química ocorra. Porém, <strong>nem toda colisão resulta em reação</strong>.</p><p>É necessário que o encontro tenha <strong>energia suficiente</strong> para superar a <strong>energia de ativação (Eₐ)</strong> e, em muitos casos, uma <strong>orientação adequada</strong> para as ligações se reorganizarem.</p><p>A <strong>energia de ativação</strong> funciona como uma barreira no caminho da reação. Uma reação exotérmica pode liberar muita energia no total e ainda assim acontecer lentamente, se essa barreira for alta.</p>`,
    points:[['Encontro','As partículas precisam se aproximar e colidir.'],['Energia ≥ Eₐ','Colisões pouco energéticas podem não reagir.'],['Orientação correta','A geometria do choque também pode ser decisiva.']],viz:'collisions',
    exampleTitle:'Por que a madeira não se incendeia sozinha?',steps:['A combustão da madeira é exotérmica: depois de iniciada, pode liberar bastante calor.','Mesmo com oxigênio no ar, a reação exige superar uma barreira inicial de ativação.','Uma fonte de ignição fornece a energia necessária para começar; depois, o calor liberado pode sustentar a combustão.'],result:'<b>Ser exotérmica não significa começar espontaneamente com rapidez.</b> ΔH e energia de ativação representam coisas diferentes.',
    trap:'<b>ΔH</b> é a diferença de entalpia entre produtos e reagentes. <b>Eₐ</b> é a barreira energética até a reação conseguir prosseguir.',note:'Choque + energia suficiente + orientação favorável.',bridge:'Temperatura, concentração e catalisadores alteram as condições para as colisões efetivas.'
  },
  {
    title:'Fatores que afetam a rapidez',short:'Controle as condições e a velocidade muda.',unit:1,time:5,icon:'⚙',
    essential:'Temperatura, concentração, pressão de gases, superfície de contato e catalisadores podem alterar a <b>rapidez</b>.',
    explain:`<p><strong>Temperatura:</strong> ao aumentar a temperatura, as partículas tendem a se mover com maior energia, e uma fração maior das colisões pode superar Eₐ. Para muitas reações, isso aumenta a rapidez.</p><p><strong>Concentração:</strong> mais partículas reagentes por volume geralmente aumenta a frequência de encontros. Em gases, aumentar a <strong>pressão por compressão</strong> pode elevar a concentração e favorecer colisões.</p><p><strong>Superfície de contato:</strong> um sólido pulverizado oferece mais área exposta do que um bloco de mesma massa, podendo reagir mais rapidamente.</p><p><strong>Catalisador:</strong> fornece um caminho reacional alternativo com menor energia de ativação. Ele é regenerado no processo global, e não altera o <strong>ΔH global</strong> nem a posição do equilíbrio químico.</p>`,
    points:[['Temperatura ↑','Geralmente mais partículas com energia adequada para reagir.'],['Concentração / superfície ↑','Mais oportunidades de contato entre reagentes.'],['Catalisador presente','Caminho alternativo com menor Eₐ.']],viz:'factors',
    exampleTitle:'Comprimido inteiro x comprimido triturado',steps:['Considere comprimidos efervescentes de mesma composição e massa reagindo com água nas mesmas condições.','Ao triturar um comprimido, a água entra em contato com uma área maior do sólido.','Em condições comparáveis, essa maior superfície favorece a rapidez da reação.'],result:'<b>Maior superfície de contato → reação geralmente mais rápida.</b> A quantidade total de reagente não aumentou.',
    trap:'O catalisador <b>não aumenta a energia dos produtos</b> e <b>não torna ΔH mais negativo</b>: ele muda o caminho da reação, reduzindo a barreira energética.',note:'Mais colisões efetivas ou menor barreira → reação mais rápida.',bridge:'O último tema transforma essa ideia em expressão matemática: a lei da velocidade.'
  },
  {
    title:'Lei da velocidade',short:'Uma equação para expressar como a rapidez varia.',unit:1,time:5,icon:'ƒ',
    essential:'<b>v = k[A]<sup>m</sup>[B]<sup>n</sup></b>. Os expoentes da lei de velocidade são determinados <b>experimentalmente</b>.',

function heroGraphic(){return `<svg class="hero-orbit" viewBox="0 0 380 275" role="img" aria-label="Dois gráficos estilizados: energia diminuindo na reação exotérmica e aumentando na endotérmica"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".09"/><stop offset="1" stop-color="#ffffff" stop-opacity=".025"/></linearGradient></defs><rect x="8" y="7" width="364" height="259" rx="20" fill="url(#hg)" stroke="#ffffff28"/><path d="M30 200H350M30 146H350M30 90H350" stroke="#ffffff13" stroke-dasharray="4 7"/><text x="30" y="32" fill="#b0bfdc" font-size="11" font-weight="800" letter-spacing="2">ENERGIA DAS REAÇÕES</text><path d="M39 75 L106 75 C132 75 137 45 170 45 S220 177 271 177 L337 177" stroke="#ffab76" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M39 200 L107 200 C136 200 137 154 172 154 S223 113 266 113 L337 113" stroke="#7ce4cf" stroke-width="5" stroke-linecap="round" fill="none"/><circle cx="337" cy="177" r="7" fill="#ffab76"/><circle cx="337" cy="113" r="7" fill="#7ce4cf"/><text x="42" y="64" fill="#ffc29c" font-size="12" font-weight="800">EXO</text><text x="41" y="227" fill="#9ae7dd" font-size="12" font-weight="800">ENDO</text><text x="262" y="238" fill="#778ab2" font-size="10">PROGRESSO →</text></svg>`}

a-hidden="true">✺</div><div><h3>Lume, seu guia de laboratório</h3><p>Ao terminar cada explicação, marque o tema como lido e ganhe 60 XP. Seu progresso fica salvo neste navegador. Você pode revisar qualquer tema quando quiser.</p></div></div><div class="actions"><button class="btn ghost" onclick="if(confirm('Reiniciar as marcações e o XP desta revisão?')){state.done=[];save();route();announce('Progresso reiniciado.')}" >↺ Reiniciar progresso</button></div>${footer()}`}

function renderLesson(i){const l=lessons[i],done=state.done.includes(i),name=l.unit?'Cinética química':'Termoquímica';return `<button class="back" onclick="go('home')">← Voltar para o mapa</button><section class="lesson-header ${l.unit?'kinetic':''}"><div class="lesson-banderole"></div><div class="lesson-head-content"><div class="eyebrow ${l.unit?'teal':'orange'}">Unidade ${String(l.unit+1).padStart(2,'0')} · ${name}</div><h1>${l.title}</h1><p class="lead">${l.short}</p><div class="lesson-head-meta"><span class="minitag">◷ ${l.time} min de leitura</span><span class="minitag">Tema ${i+1} de 10</span><span class="minitag">${done?'✓ Concluído':'○ Ainda não concluído'}</span></div><div class="lesson-summary"><span class="star">✦</span><span><b>O essencial:</b> ${l.essential}</span></div></div></section><div class="lesson-grid"><div><section class="paper"><div class="mini-heading">01 / Entenda o conceito</div><div class="body-copy">${l.explain}</div></section>${visualFor(l.viz)}<section class="example"><div class="example-head">✳ Exemplo resolvido, passo a passo</div><h3>${l.exampleTitle}</h3><ol class="solved-list">${l.steps.map(s=>`<li><span>${s}</span></li>`).join('')}</ol><div class="result"><b>Conclusão:</b> ${l.result}</div></section><section class="warning"><b>⚑ Atenção à pegadinha</b><p>${l.trap}</p></section><div class="lesson-footer"><div><b>${done?'✓ Tema registrado':'Pronto para marcar como revisado?'}</b><span class="hint">${done?'Você pode reler sem perder o progresso.':'Ganhe 60 XP ao concluir esta leitura.'}</span></div><div class="buttons">${i>0?`<button class="btn ghost" onclick="go('tema-${i-1}')">← Anterior</button>`:''}<button class="btn ${done?'white':'primary'}" onclick="markDone(${i})">${done?'✓ Concluído':'✓ Marcar como lido'}</button><button class="btn ${l.unit?'teal':'orange'}" onclick="go('${i===9?'notebook':'tema-'+(i+1)}')">${i===9?'Caderno final':'Próximo tema →'}</button></div></div></div><aside class="side-paper"><div class="mini-heading" function renderNotebook(){return `<button class="back" onclick="go('home')">← Voltar ao mapa</button><section class="notebook-top"><span class="eyebrow" style="color:#ffb884">Revisão de bolso</span><h1>Seu caderno de<br>fórmulas e conceitos.</h1><p>O que vale a pena ter na ponta da língua. Cada cartão leva à explicação completa e ao exemplo resolvido, caso você precise relembrar o raciocínio.</p><div class="actions"><button class="btn white" onclick="window.print()">▤ Imprimir / Salvar como PDF</button><button class="btn ghost" onclick="go('home')">Voltar aos assuntos</button></div></section><div class="notebook-grid">${notebookNotes.map((n,i)=>`<article class="note ${i>5?'kinetic':''}"><div class="index">${String(i+1).padStart(2,'0')} / ${i<6?'TERMOQUÍMICA':'CINÉTICA'}</div><h3>${n.title}</h3><div class="core">${n.formula}</div><p>${n.desc}</p><button onclick="go('tema-${i}')">Rever explicação →</button></article>`).join('')}</div><section class="glossary"><div class="overline">Um último lembrete</div><h2 style="margin:7px 0 21px;font-size:24px">3 diferenças que salvam pontos</h2><div class="glossary-grid"><div><b>ΔH não é Eₐ</b><p>ΔH compara produtos e reagentes. Eₐ é a barreira energética.</p></div><div><b>Rápida não é mais exotérmica</b><p>Energia liberada e rapidez medem fenômenos distintos.</p></div><div><b>Catalisador não muda ΔH</b><p>Ele oferece outro caminho, sem alterar os estados inicial e final.</p></div></div></section>${footer()}`}
function svgChart(type){const exo=type==='exo',a=exo?70:195,b=exo?190:75,color=exo?'#ec8a52':'#12a79a';return `<svg viewBox="0 0 600 244" class="diagram-svg" role="img" aria-label="Gráfico qualitativo de entalpia: produtos ${exo?'com menor':'com maior'} energia que reagentes"><path d="M55 20V206H570" fill="none" stroke="#9eacc0" stroke-width="2"/><text x="26" y="125" transform="rotate(-90 26 125)" fill="#8392aa" font-size="13">Entalpia (H)</text><text x="345" y="234" fill="#8392aa" font-size="13">Caminho da reação →</text><line x1="70" y1="${a}" x2="215" y2="${a}" stroke="${color}" stroke-width="5" stroke-linecap="round"/><path d="M215 ${a} C255 ${a} 253 28 302 28 S353 ${b} 395 ${b}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round"/><line x1="395" y1="${b}" x2="535" y2="${b}" stroke="${color}" stroke-width="5" stroke-linecap="round"/><line x1="470" y1="${a}" x2="470" y2="${b}" stroke="#b9c2d1" stroke-dasharray="5 5" stroke-width="2"/><path d="M464 ${b+(exo?-0:0)} l6 ${exo?10:-10} l6 ${exo?-10:10}" fill="none" stroke="${color}" stroke-width="2.5"/><text x="74" y="${a-13}" fill="#5f6c83" font-size="13">Reagentes</text><text x="403" y="${b-13}" fill="#5f6c83" font-size="13">Produtos</text><text x="480" y="${(a+b)/2}" fill="${color}" font-size="14" font-weight="bold">ΔH ${exo?'&lt; 0':'&gt; 0'}</text></svg>`}

case 'combustion':title='O que muda quando falta oxigênio';body=`<div class="two-panels"><div class="visual-panel"><div class="visual-symbol">🔥</div><b>Combustão completa</b><p>O₂ em quantidade suficiente. Para hidrocarbonetos, os produtos típicos são CO₂ e H₂O.</p></div><div class="visual-panel"><div class="visual-symbol">☁</div><b>Combustão incompleta</b><p>O₂ insuficiente. Pode surgir CO, fuligem e outros compostos, além de H₂O.</p></div></div>`;caption='CO é um gás tóxico e não deve ser confundido com CO₂, apesar de ambos conterem carbono e oxigênio.';break;
case 'environment':title='A química por trás dos impactos';body=`<div class="two-panels"><div class="visual-panel"><div class="visual-symbol">◌</div><b>Clima</b><p>CO₂ e outros gases de efeito estufa contribuem para o aquecimento global.</p></div><div class="visual-panel"><div class="visual-symbol">≈</div><b>Qualidade do ar</b><p>NOₓ, SO₂, CO e partículas podem prejudicar ambiente e saúde.</p></div><div class="visual-panel"><div class="visual-symbol">↺</div><b>Eficiência</b><p>Mais energia útil por recurso utilizado reduz desperdícios.</p></div><div class="visual-panel"><div class="visual-symbol">♻</div><b>Ciclo de vida</b><p>Impactos incluem produção, operação e descarte.</p></div></div>`;caption='Uma decisão energética depende do contexto e de múltiplos indicadores, não de um rótulo único.';break;
case 'rate':title='A inclinação revela a rapidez';body=`<svg class="diagram-svg" viewBox="0 0 600 255" role="img" aria-label="Gráfico da concentração do reagente diminuindo com o tempo"><path d="M60 15V211H570" fill="none" stroke="#97a5bc" stroke-width="2"/><text x="20" y="128" fill="#8b99ad" font-size="13" transform="rotate(-90 20 128)">Concentração [A]</text><text x="425" y="239" fill="#8b99ad" font-size="13">Tempo (s) →</text><path d="M60 35C165 90 271 146 545 185" stroke="#11a69a" stroke-width="5" stroke-linecap="round" fill="none"/><circle cx="110" cy="62" r="6" fill="#11a69a"/><circle cx="450" cy="174" r="6" fill="#11a69a"/><path d="M110 62V211M450 174V211M110 62H60M450 174H60" stroke="#aab9cb" stroke-dasharray="5 5"/><text x="74" y="52" font-size="13" fill="#4c7381">[A] maior</text><text x="450" y="166" font-size="13" fill="#4c7381">[A] menor</text></svg>`;caption='A curva é qualitativa. A rapidez média usa dois pontos e um intervalo; a instantânea corresponde à inclinação da tangente em um instante.';break;
case 'collisions':title='O filtro das colisões efetivas';body=`<div class="two-panels"><div class="visual-panel"><div class="visual-symbol" style="color:#ef8850">●  ⇢  ●</div><b>Encontro insuficiente</b><p>Sem energia bastante ou com orientação desfavorável, pode não haver reação.</p></div><div class="visual-panel"><div class="visual-symbol" style="color:#079f94">● ⇢ ✧ ⇠ ●</div><b>Encontro efetivo</b><p>Energia suficiente e orientação adequada favorecem a transformação.</p></div></div>`;caption='As partículas não precisam “ter ΔH”; elas precisam superar a barreira de ativação do caminho reacional.';break;
case 'factors':title='Laboratório de colisões (ilustrativo)';body=`<div class="collision-lab"><div class="particle-scene" id="particleScene" aria-label="Animação ilustrativa de partículas em movimento">${Array.from({length:12},(_,i)=>`<span class="particle" data-particle="${i+1}" aria-hidden="true"></span>`).join('')}</div><div class="lab-controls"><div><label for="temperature">Temperatura: <span id="temperatureLabel">média</span></label><small>Mais energia nas colisões</small><input type="range" id="temperature" min="1" max="3" value="2" oninput="updateCollisionLab()"></div><div><label for="concentration">Concentração: <span id="concentrationLabel">média</span></label><small>Mais partículas disponíveis</small><input type="range" id="concentration" min="1" max="3" value="2" oninput="updateCollisionLab()"></div></div><p class="lab-output" id="labOutput">Aumentar temperatura ou concentração costuma favorecer encontros efetivos.</p></div>`;caption='Modelo conceitual, sem escala física: as partículas animadas não simulam uma reação quantitativamente.';break;
case 'law':title='O padrão aparece nos experimentos';body=`<div class="table-scroll"><table class="simple-table"><thead><tr><th>Ensaio</th><th>[A]</th><th>[B]</th><th>Rapidez</th></tr></thead><tbody><tr><td>1</td><td>1</td><td>1</td><td>1</td></tr><tr><td>2</td><td><b>2</b></td><td>1</td><td><b>2</b></td></tr><tr><td>3</td><td>1</td><td><b>2</b></td><td><b>4</b></td></tr></tbody></table></div><div class="pill-grid"><span>A × 2 → v × 2</span><span>B × 2 → v × 4</span><span>Logo: v = k[A][B]²</span></div>`;caption='Os valores da tabela são relativos, com as demais condições mantidas constantes. Nunca inferir a ordem apenas da equação global.';break;
}
return `<figure class="diagram-card"><div class="mini-heading">02 / Veja na prática</div><div class="diagram-title">${title}</div>${body}<figcaption class="diagram-caption">${caption}</figcaption></figure>`}
function setEnthalpy(type){$('#enthalpyPlot').innerHTML=svgChart(type);$('#enthalpyText').textContent=type==='exo'?'Produtos terminam com menos entalpia. A diferença foi liberada para o ambiente.':'Produtos terminam com mais entalpia. O sistema precisou absorver energia do ambiente.';['Exo','Endo'].forEach(k=>{const b=$('#btn'+k);b.classList.toggle('selected',k.toLowerCase()===type);b.setAttribute('aria-pressed',String(k.toLowerCase()===type))})}
function updateCollisionLab(){const t=Number($('#temperature').value),c=Number($('#concentration').value),labels=['','baixa','média','alta'];$('#temperatureLabel').textContent=labels[t];$('#concentrationLabel').textContent=labels[c];$('#particleScene').style.setProperty('--speed',(5-t*.95)+'s');document.querySelectorAll('[data-particle]').forEach(el=>el.style.display=Number(el.dataset.particle)<=(c===1?4:c===2?8:12)?'block':'none');$('#labOutput').textContent=(t===3?'Temperatura maior: aumenta a fração de colisões com energia suficiente. ':t===1?'Temperatura menor: tende a reduzir a fração de colisões suficientemente energéticas. ':'Temperatura intermediária. ')+(c===3?'Mais partículas no mesmo volume: mais encontros possíveis.':c===1?'Menos partículas no mesmo volume: menos encontros possíveis.':'Concentração intermediária.');}
function setupDemos(){if($('#particleScene'))updateCollisionLab()}
let toastHandle=null;function announce(message){const t=$('#toast');t.textContent=message;t.classList.add('visible');clearTimeout(toastHandle);toastHandle=setTimeout(()=>t.classList.remove('visible'),2800)}
$('#menuBtn').onclick=()=>{let open=document.body.classList.toggle('nav-open');$('#menuBtn').setAttribute('aria-expanded',String(open))};$('#mobileShadow').onclick=closeMenu;window.addEventListener('hashchange',route);window.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});navSetup();if(!location.hash&&state.view&&state.view!=='home')location.hash=state.view==='notebook'?'caderno':state.view;route();
</script>
</body>
</html>
